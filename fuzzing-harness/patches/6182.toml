issue = "https://github.com/gleam-lang/gleam/issues/6182"
pr = "https://github.com/gleam-lang/gleam/pull/6186"
description = """
A bit array pattern matching an empty string segment (e.g. <<"":utf8>>)
generates invalid JavaScript containing `(cond && )`, a syntax error.
"""
patch = "6182.patch"

# Source file hashes recorded when the patch was captured. When any of these
# change upstream (PR merged, refactor, etc.) the patch fails to apply and
# `gleam-patch apply` reports it as resolved.
#
# The CHANGELOG.md change from the PR is intentionally omitted from the patch
# since the fuzz branch's CHANGELOG has drifted from main and we only need
# the source fix here.
